name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-root
          MARIADB_DATABASE: php_sms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, mysqli, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --strict
      - run: composer check
        env:
          SMS_TEST_HOST: 127.0.0.1
          SMS_TEST_PORT: 3306
          SMS_TEST_DATABASE: php_sms_test
          SMS_TEST_USER: root
          SMS_TEST_PASSWORD: test-root
